type CohorteVaeCollective {
  id: ID!
  nom: String!
  codeInscription: String
  commanditaireVaeCollective: CommanditaireVaeCollective!
  certificationCohorteVaeCollectives: [CertificationCohorteVaeCollective!]!
  createdAt: Timestamp!
  status: CohorteVaeCollectiveStatus!
  organism: Organism
  organismId: ID
}
enum CohorteVaeCollectiveStatus {
  BROUILLON
  PUBLIE
}

type CertificationCohorteVaeCollective {
  id: ID!
  certification: Certification!
}

type SousCompteVaeCollective {
  id: ID!
  account: Account!
  canCreateCohorteVaeCollective: Boolean!
  rolesSpecificToCohorte(cohorteVaeCollectiveId: ID!): [RoleVaeCollective!]!
}

type SousCompteVaeCollectivePage {
  rows: [SousCompteVaeCollective!]!
  info: PaginationInfo!
}

type CommanditaireVaeCollective {
  id: ID!
  raisonSociale: String!
  createdAt: Timestamp!
  cohorteVaeCollectives(offset: Int, limit: Int): CohorteVaeCollectivePage!
  metabaseDashboardIframeUrl: String
  sousComptes(
    offset: Int
    limit: Int
    searchFilter: String
  ): SousCompteVaeCollectivePage!
}

type CommanditaireVaeCollectivePage {
  rows: [CommanditaireVaeCollective!]!
  info: PaginationInfo!
}

type CohorteVaeCollectivePage {
  rows: [CohorteVaeCollective!]!
  info: PaginationInfo!
}

type Candidacy {
  cohorteVaeCollective: CohorteVaeCollective
}

type Account {
  commanditaireVaeCollective: CommanditaireVaeCollective
}

enum PermissionVaeCollective {
  CREER_COHORTE
  MODIFIER_COHORTE
  SUPPRIMER_COHORTE
  VOIR_LISTE_COHORTES
  MODIFIER_DROITS_ACCES_COHORTE
  VOIR_COHORTE
  VOIR_STATISTIQUES
  VOIR_LISTE_SOUS_COMPTES
  VOIR_SOUS_COMPTE
  CREER_SOUS_COMPTE
  MODIFIER_SOUS_COMPTE
  SUPPRIMER_SOUS_COMPTE
}

enum RoleVaeCollective {
  ADMINISTRATEUR_PORTEUR_DE_PROJET
  SOUS_COMPTE_VAE_COLLECTIVE
  CREATEUR_COHORTE
  LECTEUR_COHORTE
  EDITEUR_COHORTE
}

type Query {
  vaeCollective_commanditaireVaeCollectives(
    offset: Int
    limit: Int
    searchFilter: String
  ): CommanditaireVaeCollectivePage!
  cohorteVaeCollective(codeInscription: String!): CohorteVaeCollective
  cohortesVaeCollectivesForConnectedAap: [CohorteVaeCollective!]!
  cohortesVaeCollectivesForConnectedCertificationAuthorityOrLocalAccount: [CohorteVaeCollective!]!
  vaeCollective_getCommanditaireVaeCollective(
    commanditaireVaeCollectiveId: ID!
  ): CommanditaireVaeCollective!
  vaeCollective_getCohorteVaeCollectiveById(
    commanditaireVaeCollectiveId: ID!
    cohorteVaeCollectiveId: ID!
  ): CohorteVaeCollective!
  vaeCollective_getUserPermissions(
    cohorteVaeCollectiveId: ID
  ): [PermissionVaeCollective!]!
  vaeCollective_getSousCompteVaeCollective(
    commanditaireVaeCollectiveId: ID!
    sousCompteVaeCollectiveId: ID!
  ): SousCompteVaeCollective!
}

input SousCompteVaeCollectiveAndRoleInput {
  sousCompteVaeCollectiveId: ID!
  roles: [RoleVaeCollective!]!
}

type Mutation {
  vaeCollective_createCohorteVaeCollective(
    commanditaireVaeCollectiveId: ID!
    nomCohorteVaeCollective: String!
  ): CohorteVaeCollective!
  vaeCollective_updateNomCohorteVaeCollective(
    commanditaireVaeCollectiveId: ID!
    cohorteVaeCollectiveId: ID!
    nomCohorteVaeCollective: String!
  ): CohorteVaeCollective!
  vaeCollective_updateCohorteVAECollectiveCertification(
    commanditaireVaeCollectiveId: ID!
    cohorteVaeCollectiveId: ID!
    certificationIds: [ID!]!
  ): CohorteVaeCollective!

  vaeCollective_updateCohorteVAECollectiveOrganism(
    commanditaireVaeCollectiveId: ID!
    cohorteVaeCollectiveId: ID!
    organismId: ID!
  ): CohorteVaeCollective!

  vaeCollective_publishCohorteVAECollective(
    commanditaireVaeCollectiveId: ID!
    cohorteVaeCollectiveId: ID!
  ): CohorteVaeCollective!

  vaeCollective_deleteCohorteVaeCollective(
    commanditaireVaeCollectiveId: ID!
    cohorteVaeCollectiveId: ID!
  ): Void!

  vaeCollective_createCommanditaireVaeCollective(
    raisonSociale: String!
    gestionnaireFirstname: String!
    gestionnaireLastname: String!
    gestionnaireEmail: String!
  ): CommanditaireVaeCollective!

  vaeCollective_createSousCompteVaeCollective(
    commanditaireVaeCollectiveId: ID!
    accountFirstname: String!
    accountLastname: String!
    accountEmail: String!
    canCreateCohorteVaeCollective: Boolean!
  ): SousCompteVaeCollective!

  vaeCollective_updateSousCompteVaeCollective(
    commanditaireVaeCollectiveId: ID!
    sousCompteVaeCollectiveId: ID!
    canCreateCohorteVaeCollective: Boolean!
  ): SousCompteVaeCollective!

  vaeCollective_updateRolesSpecificToCohorteOfSousCompteVaeCollective(
    commanditaireVaeCollectiveId: ID!
    cohorteVaeCollectiveId: ID!
    sousComptesIdsAndRoles: [SousCompteVaeCollectiveAndRoleInput!]!
  ): CohorteVaeCollective!
}
