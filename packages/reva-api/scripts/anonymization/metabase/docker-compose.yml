services:
  postgresql_reva_metabase:
    image: postgres:16.11
    container_name: postgresql_reva_metabase
    restart: always
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: password
    ports:
      - 5447:5432
    networks:
      - metanet1
