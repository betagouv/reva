services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: always
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: pro connect
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://fca.integ01.dev-agentconnect.fr/api/v2
      # Registered in the ProConnect sandbox partner portal for redirect_uri
      # http://localhost:4180/oauth2/callback.
      OAUTH2_PROXY_CLIENT_ID: feca8f080267aa141e4ddedc08c86647eaf3a12d17443e5b2e3f5c841f7010da
      OAUTH2_PROXY_CLIENT_SECRET: eba7a798f29a3c3e24940c97efbfb27147b14e4f2f5005999023c82be983dde0
      # Generate with: openssl rand -base64 32
      OAUTH2_PROXY_COOKIE_SECRET: changeme-32-byte-base64-secret==
      OAUTH2_PROXY_COOKIE_SECURE: false
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      # Proxied app. Defaults to reva-admin-react; point at any local frontend/port.
      #OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:3003
      OAUTH2_PROXY_UPSTREAMS: https://metabase.vae.gouv.fr/
      # Without this, oauth2-proxy forwards the original "localhost:4180" Host header,
      # which the real metabase.vae.gouv.fr reverse proxy doesn't recognize (-> EOF/502).
      OAUTH2_PROXY_PASS_HOST_HEADER: false
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/app/dist/,^/api/embed/dashboard"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    ports:
      - 4180:4180
